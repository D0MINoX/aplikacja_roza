name: Build iOS IPA (.NET 10)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15 # Wymuszamy najnowszy obraz macOS z zainstalowanymi nowymi SDK

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install & Restore Workloads
      run: |
        dotnet workload install maui-ios
        dotnet workload restore MauiApp1/MauiApp1.csproj

    # ZAMIAST SEUP-XCODE: Automatycznie wybieramy najwyższą dostępną wersję Xcode 16 bezpośrednio w systemie macOS
    - name: Select Correct Xcode Version
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$XCODE_PATH" ]; then
          echo "Znaleziono Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        else
          echo "Nie znaleziono dedykowanego Xcode 16, używam domyślnego."
        fi

    - name: Build and Publish iOS App
      run: |
        dotnet publish MauiApp1/MauiApp1.csproj \
          -f net10.0-ios \
          -c Release \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:BuildIpa=True \
          -p:CodesignKey="-" \
          -p:CodesignProvision="-" \
          -p:RequireProvisioningProfile=False

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AplikacjaRoza-iOS-IPA
        path: '**/*.ipa'
