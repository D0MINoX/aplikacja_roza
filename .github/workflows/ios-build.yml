name: Build iOS IPA (.NET 10)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # RĘCZNE WYMUSZENIE SYSTEMOWE: Przypisujemy na sztywno sprawdzoną ścieżkę do Xcode 26.3.0
    - name: Force Xcode 26.3
      run: |
        sudo xcode-select -s /Applications/Xcode_26.3.0.app/Contents/Developer
        xcodebuild -version

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Workloads
      run: |
        dotnet workload install maui
        dotnet workload restore MauiApp1/MauiApp1.csproj

    - name: Build and Publish iOS App
      run: |
        dotnet publish MauiApp1/MauiApp1.csproj \
          -f net10.0-ios \
          -c Release \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:BuildIpa=True \
          -p:CodesignKey="-" \
          -p:CodesignProvision="-" \
          -p:RequireProvisioningProfile=False \
          -p:_SdkAllowedXcodeVersion=26.3
          
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AplikacjaRoza-iOS-IPA
        path: '**/*.ipa'
