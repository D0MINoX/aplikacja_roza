name: Build iOS IPA (.NET 10)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15 # Ten obraz ma już fabrycznie zdefiniowane najnowsze narzędzia

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # USUNĘLIŚMY SETUP-XCODE: zamiast tego pozwalamy systemowi macOS 15 
    # użyć swojego domyślnego, najnowszego produkcyjnego Xcode (którym jest 26.5 / 16.5)

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Instalujemy pełne środowisko MAUI (iOS + Android)
    - name: Install Workloads
      run: |
        dotnet workload install maui
        dotnet workload restore MauiApp1/MauiApp1.csproj

    - name: Build and Publish iOS App
      run: |
        dotnet publish MauiApp1/MauiApp1.csproj \
          -f net10.0-ios \
          -c Release \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:BuildIpa=True \
          -p:CodesignKey="-" \
          -p:CodesignProvision="-" \
          -p:RequireProvisioningProfile=False
          
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AplikacjaRoza-iOS-IPA
        path: '**/*.ipa'
