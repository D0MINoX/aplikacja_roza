name: Build iOS IPA (.NET 10)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Ustawiamy Xcode na 26.3, które jest stabilne i dostępne
    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 2. KLUCZOWY KROK: Instalujemy konkretną, stabilną wersję pakietu iOS, 
    # która nie ma jeszcze narzuconego wymogu posiadania Xcode 26.5.
    - name: Install Specific iOS Workload
      run: |
        dotnet workload install maui --version 10.0.100-preview.1
        dotnet workload restore MauiApp1/MauiApp1.csproj

    - name: Build and Publish iOS App
      run: |
        dotnet publish MauiApp1/MauiApp1.csproj \
          -f net10.0-ios \
          -c Release \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:BuildIpa=True \
          -p:CodesignKey="-" \
          -p:CodesignProvision="-" \
          -p:RequireProvisioningProfile=False
          
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AplikacjaRoza-iOS-IPA
        path: '**/*.ipa'
