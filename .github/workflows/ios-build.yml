name: Build iOS IPA (.NET 10)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet-ios

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install iOS workload
        run: |
          xcodebuild -version
          dotnet --version
          dotnet workload install maui-ios --version 10.0.401
          dotnet workload --version

      - name: Build iOS IPA
        run: |
          mkdir -p artifacts
          dotnet publish MauiApp1/MauiApp1.csproj \
            -f net10.0-ios \
            -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=true \
            -p:EnableCodeSigning=false \
            -p:IpaPackagePath="$GITHUB_WORKSPACE/artifacts/AplikacjaRoza.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AplikacjaRoza-iOS-IPA
          path: artifacts/AplikacjaRoza.ipa
          if-no-files-found: error
