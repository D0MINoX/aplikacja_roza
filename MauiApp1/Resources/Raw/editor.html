<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <style>
        :root {
            --bg-color: #FFFFFF;
            --text-color: #333333;
            --border-color: #CCCCCC;
            --toolbar-bg: #F3F3F3;
        }

        body.dark {
            --bg-color: #1E1E1E;
            --text-color: #FFFFFF;
            --border-color: #444444;
            --toolbar-bg: #2D2D2D;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        #editor-container {
            height: calc(100vh - 42px);
            font-size: 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
        }

        .ql-editor {
            text-align: justify;
        }

        .ql-toolbar.ql-snow {
            background-color: var(--toolbar-bg);
            border: 1px solid var(--border-color) !important;
        }

        .ql-container.ql-snow {
            border: 1px solid var(--border-color) !important;
            border-top: none !important;
        }

        /* Motyw ciemny edytora */
        body.dark .ql-snow .ql-stroke {
            stroke: #FFFFFF;
        }

        body.dark .ql-snow .ql-fill {
            fill: #FFFFFF;
        }

        body.dark .ql-snow .ql-picker {
            color: #FFFFFF;
        }

        body.dark .ql-snow .ql-picker-options {
            background-color: #2D2D2D;
            border-color: #444444;
        }

        p, body {
            text-align: justify;
            text-justify: inter-word;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            hyphens: auto;
        }

        /* --- DEFINICJE CZCIONEK SYSTEMOWYCH --- */
        .ql-font-arial {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .ql-font-georgia {
            font-family: Georgia, "Times New Roman", serif;
        }

        .ql-font-times {
            font-family: "Times New Roman", Times, serif;
        }

        .ql-font-courier {
            font-family: "Courier New", Courier, monospace;
        }

        .ql-font-trebuchet {
            font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;
        }

        .ql-font-verdana {
            font-family: Verdana, Geneva, sans-serif;
        }

        /* Style etykiet na liście wyboru w Quill */
        .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="arial"]::before,
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="arial"]::before {
            content: 'Bezszeryfowa (Arial/Roboto)';
            font-family: Arial, sans-serif;
        }

        .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="georgia"]::before,
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="georgia"]::before {
            content: 'Georgia';
            font-family: Georgia, serif;
        }

        .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="times"]::before,
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="times"]::before {
            content: 'Times New Roman';
            font-family: "Times New Roman", serif;
        }

        .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="trebuchet"]::before,
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="trebuchet"]::before {
            content: 'Trebuchet MS';
            font-family: "Trebuchet MS", sans-serif;
        }

        .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="verdana"]::before,
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="verdana"]::before {
            content: 'Verdana';
            font-family: Verdana, sans-serif;
        }

        .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="courier"]::before,
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="courier"]::before {
            content: 'Maszynopis (Courier)';
            font-family: "Courier New", monospace;
        }
    </style>
</head>
<body class="light">
    <div id="editor-container"></div>
    <script>
        // Rejestracja czcionek w Quill JS
        var Font = Quill.import('formats/font');
        Font.whitelist = ['arial', 'georgia', 'times', 'trebuchet', 'verdana', 'courier'];
        Quill.register(Font, true);

        var quill = new Quill('#editor-container', {
            modules: {
                toolbar: [
                    [{ 'font': Font.whitelist }],
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'align': [] }],
                    ['clean']
                ],
                keyboard: {
                    bindings: {
                        shiftEnter: {
                            key: 'Enter',
                            shiftKey: true,
                            handler: function (range, context) {
                                this.quill.insertText(range.index, '\n', 'user');
                                this.quill.setSelection(range.index + 1, 'silent');
                                return false;
                            }
                        }
                    }
                }
            },
            theme: 'snow'
        });

        function setDarkMode(isDark) {
            if (isDark) {
                document.body.classList.remove('light');
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
                document.body.classList.add('light');
            }
        }

        function getHtml() { return quill.root.innerHTML; }
        function setHtml(html) { quill.root.innerHTML = html; }
    </script>
</body>
</html>
